name: Test and publish Notera
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: http://localhost:3000
      POSTGRES_PASSWORD: notera_ci_ephemeral_database_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate VPS configuration
        run: docker compose -f compose.vps.yaml config --quiet
      - name: Start application with PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify HTTP health and account bootstrap
        run: |
          curl --fail --retry 5 http://127.0.0.1:3000/api/health
          docker compose exec -T -e NOTERA_BOOTSTRAP_PASSWORD=notera-ci-account-only-password app npm run user:add -- ci "CI Test"
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up disposable CI database
        if: always()
        run: docker compose down -v
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/skords83/notera:latest
            ghcr.io/skords83/notera:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/skords83/notera
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
