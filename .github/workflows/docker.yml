name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: http://localhost:3000
      APP_PORT: '3000'
      NOTERA_IMAGE: notera:ci
      POSTGRES_PASSWORD: ci-disposable-notera-password-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test API, persistence and offline synchronization
        run: npm test
      - name: Build web app for browser tests
        run: npm run build
      - name: Install Chromium for disposable browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks (desktop, 360px, 320px)
        run: npm run test:browser
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production image (includes TypeScript and Vite checks)
        run: docker build --tag notera:ci .
      - name: Start app and PostgreSQL
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Check HTTP and bootstrap CLI
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health
          curl --fail --output /dev/null http://localhost:3000/
          docker compose exec -T -e NOTERA_BOOTSTRAP_PASSWORD="$POSTGRES_PASSWORD" app npm run user:add -- ci-user "CI user"
          docker compose exec -T db psql -U notera -d notera -v ON_ERROR_STOP=1 -c "INSERT INTO lists(id,owner_id,name,color) SELECT '10000000-0000-4000-8000-000000000001',id,'CI list color','teal' FROM users WHERE username='ci-user'"
          docker compose exec -T db psql -U notera -d notera -tAc "SELECT color FROM lists WHERE inbox" | grep -qx 'auto'
          docker compose exec -T db psql -U notera -d notera -tAc "SELECT version FROM schema_migrations WHERE version=2" | grep -qx '2'
      - name: Check persistence after restart
        run: |
          docker compose restart db app
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 3 http://localhost:3000/api/health
          docker compose exec -T db psql -U notera -d notera -tAc "SELECT count(*) FROM users WHERE username='ci-user'" | grep -qx '1'
          docker compose exec -T db psql -U notera -d notera -tAc "SELECT color FROM lists WHERE id='10000000-0000-4000-8000-000000000001'" | grep -qx 'teal'
      - name: Container logs on failure
        if: failure() && env.POSTGRES_PASSWORD != ''
        run: docker compose logs --no-color --tail 150
      - name: Remove disposable containers and database
        if: always() && env.POSTGRES_PASSWORD != ''
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker image (linux/amd64)'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
