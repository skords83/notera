<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notera – Designreferenz</title><style>body{margin:0;padding:20px;background:#111318} @media(max-width:650px){body{padding:0}}</style></head><body>
<div id="notera-preview">
  <div class="n-shell">
    <aside class="n-sidebar">
      <div class="n-brand"><span class="n-logo">n.</span><strong>Notera</strong></div>
      <div class="n-account">Sven <span class="n-avatar">SK</span></div>
      <nav aria-label="Ansichten">
        <button class="n-nav cursor-interaction" data-view="Eingang"><span class="n-icon" aria-hidden="true">▤</span>Eingang<span class="n-count"></span></button>
        <button class="n-nav cursor-interaction" data-view="Heute"><span class="n-icon" aria-hidden="true">☼</span>Heute</button>
      </nav>
      <div class="n-label">MEINE LISTEN</div>
      <button class="n-nav cursor-interaction" data-view="3D-Druck"><span class="n-dot n-purple"></span>3D-Druck</button>
      <button class="n-nav cursor-interaction" data-view="Bestellen"><span class="n-dot n-orange"></span>Bestellen</button>
      <div class="n-label">MIT SANDRA</div>
      <button class="n-nav cursor-interaction" data-view="Gemeinsam"><span class="n-dot n-green"></span>Gemeinsam<span class="n-icon" aria-hidden="true">↔</span></button>
      <button class="n-nav cursor-interaction" data-view="Haus & Ausbau"><span class="n-dot n-blue"></span>Haus & Ausbau</button>
      <div class="n-sidebar-foot"><span class="n-icon" aria-hidden="true">✓</span>Designentwurf</div>
    </aside>
    <main class="n-main">
      <header class="n-top"><span>Designreferenz · lokale Beispieldaten</span><span class="n-avatar">SK</span></header>
      <div class="n-heading"><div><h1 id="n-title">Eingang</h1><p id="n-subtitle">Erst festhalten. Später einordnen.</p></div><span id="n-sharing" hidden>Sven + Sandra</span></div>
      <form id="n-add" class="n-compose"><span class="n-icon" aria-hidden="true">+</span><input id="n-input" aria-label="Neue Aufgabe" placeholder="Was möchtest du festhalten?" autocomplete="off" maxlength="240"><button class="cursor-interaction" type="submit" aria-label="Aufgabe hinzufügen"><span class="n-icon" aria-hidden="true">↑</span></button></form>
      <div class="n-section"><span id="n-open">Offen</span></div>
      <div id="n-tasks" aria-live="polite"></div>
      <div id="n-detail" hidden></div>
      
    </main>
  </div>
</div>
<style>
#notera-preview{--n-bg:#191b20;--n-side:#22252c;--n-field:#262a33;--n-line:#343945;--n-text:#eeeef2;--n-muted:#a9afbd;--n-blue:#90b7ff;--n-green:#8ecfb2;--n-purple:#b5a0eb;--n-orange:#dfb185;font-family:Inter,system-ui,sans-serif;color:var(--n-text);font-size:15px;line-height:1.5;color-scheme:dark}
#notera-preview *{box-sizing:border-box}#notera-preview button,#notera-preview input{font:inherit}#notera-preview button{color:inherit}#notera-preview .n-shell{display:grid;grid-template-columns:230px minmax(0,1fr);border-radius:20px;overflow:hidden;background:var(--n-bg);min-height:600px}#notera-preview .n-sidebar{background:var(--n-side);padding:28px 16px;display:flex;flex-direction:column;gap:6px}#notera-preview .n-brand{display:flex;gap:12px;align-items:center;padding:0 10px;font-size:23px}#notera-preview strong{font-weight:500}#notera-preview .n-logo{background:var(--n-blue);color:var(--n-bg);border-radius:12px;width:38px;height:38px;text-align:center;font-weight:500}#notera-preview .n-account{padding:24px 10px;display:flex;align-items:center;justify-content:space-between;color:var(--n-muted)}#notera-preview .n-avatar{border-radius:50%;background:var(--n-field);color:var(--n-muted);width:32px;height:32px;display:inline-flex;justify-content:center;align-items:center;font-size:12px;flex-shrink:0}#notera-preview .n-nav{display:flex;gap:12px;align-items:center;text-align:left;background:transparent;border:0;border-radius:9px;padding:11px 12px;width:100%;min-height:44px}#notera-preview .n-nav.active{background:#343f54;color:var(--n-blue)}#notera-preview .n-nav:hover{background:var(--n-field)}#notera-preview .n-nav svg{width:18px;height:18px;flex-shrink:0}#notera-preview .n-count{margin-left:auto}#notera-preview .n-label{font-size:11px;letter-spacing:1.3px;color:var(--n-muted);margin:24px 12px 8px}#notera-preview .n-dot{width:10px;height:10px;border-radius:50%;margin:0 4px;flex-shrink:0}#notera-preview .n-purple{background:var(--n-purple)}#notera-preview .n-orange{background:var(--n-orange)}#notera-preview .n-green{background:var(--n-green)}#notera-preview .n-blue{background:var(--n-blue)}#notera-preview .n-sidebar-foot{margin-top:auto;padding:28px 12px 0;display:flex;gap:8px;align-items:center;color:var(--n-muted);font-size:12px}#notera-preview .n-sidebar-foot svg{width:14px}#notera-preview .n-main{padding:24px 38px 30px;min-width:0}#notera-preview .n-top{display:flex;justify-content:space-between;align-items:center;color:var(--n-muted);font-size:12px;gap:16px}#notera-preview .n-heading{margin:44px 0 28px;display:flex;gap:16px;justify-content:space-between;align-items:center}#notera-preview .n-eyebrow{color:var(--n-blue);font-size:11px;letter-spacing:2px}#notera-preview h1{font-size:34px;line-height:1.2;font-weight:500;margin:9px 0 10px}#notera-preview p{color:var(--n-muted);margin:0}#notera-preview #n-sharing{font-size:12px;color:var(--n-green)}#notera-preview .n-compose{display:flex;gap:12px;align-items:center;background:var(--n-field);padding:10px 12px;border-radius:12px}#notera-preview .n-compose>svg{color:var(--n-blue);width:20px;flex-shrink:0}#notera-preview input{background:transparent;color:var(--n-text);border:0;min-width:0;flex:1;padding:8px 0;font-size:16px}#notera-preview input::placeholder{color:var(--n-muted)}#notera-preview .n-compose button{border:0;border-radius:8px;background:var(--n-blue);color:var(--n-bg);width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}#notera-preview .n-section{display:flex;justify-content:space-between;gap:10px;margin:30px 0 8px;font-size:12px;color:var(--n-muted)}#notera-preview .n-row{display:flex;align-items:flex-start;gap:12px;padding:18px 0;border-bottom:1px solid var(--n-line)}#notera-preview .n-check{appearance:none;border:1.5px solid var(--n-muted);border-radius:50%;background:transparent;width:23px;height:23px;margin:0;flex:0 0 23px;min-height:23px;position:relative}#notera-preview .n-check:checked{background:var(--n-blue);border-color:var(--n-blue)}#notera-preview .n-check:checked:after{content:'✓';color:var(--n-bg);position:absolute;left:4px;top:0}#notera-preview .n-task{background:transparent;border:0;text-align:left;padding:0;flex:1;min-width:0;overflow-wrap:anywhere}#notera-preview .n-task small{display:block;color:var(--n-muted);font-size:12px;margin-top:5px}#notera-preview .n-row.done .n-task{color:var(--n-muted);text-decoration:line-through}#notera-preview .n-owner{font-size:11px;color:var(--n-green);background:#273c34;border-radius:6px;padding:3px 7px;flex-shrink:0}#notera-preview .n-footer{margin-top:40px;font-size:12px;color:var(--n-muted)}#notera-preview #n-detail{margin-top:24px;background:var(--n-field);padding:20px;border-radius:12px;overflow-wrap:anywhere}#notera-preview #n-detail p{margin-top:8px;font-size:13px}#notera-preview #n-detail button{margin-top:16px;background:transparent;border:1px solid var(--n-line);padding:8px 14px;border-radius:8px}#notera-preview [hidden]{display:none!important}
@media(max-width:650px){#notera-preview .n-shell{grid-template-columns:1fr;min-height:0}#notera-preview .n-sidebar{padding:18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px}#notera-preview .n-brand{grid-column:1/-1;margin-bottom:12px}#notera-preview .n-account,#notera-preview .n-label,#notera-preview .n-sidebar-foot{display:none}#notera-preview .n-sidebar nav{display:contents}#notera-preview .n-main{padding:24px 20px}#notera-preview .n-heading{margin-top:28px}#notera-preview .n-top>span:first-child{font-size:11px}#notera-preview .n-section{flex-wrap:wrap}#notera-preview .n-task{min-height:44px}#notera-preview .n-check{margin-top:8px}#notera-preview .n-owner{margin-top:6px}}
#notera-preview .n-icon{display:inline-flex;justify-content:center;align-items:center;min-width:18px;font-size:20px}#notera-preview .n-compose>.n-icon{color:var(--n-blue)}
</style>
<script>
(()=>{const root=document.getElementById('notera-preview');const get=id=>root.querySelector('#'+id);let view='Eingang';let next=20;const tasks=[{id:1,list:'Eingang',title:'Eine trockene Aufbewahrung fürs Filament überlegen',note:'Idee · noch nicht eingeordnet'},{id:2,list:'Eingang',title:'Die nächste Trollfigur drucken',note:'Idee · ohne Termin'},{id:3,list:'Eingang',title:'Nachschauen, was wir noch bestellen müssen',note:'Gedanke · ohne Termin'},{id:4,list:'3D-Druck',title:'Vorlage für die nächste Figur vorbereiten',note:'Modell suchen → prüfen → drucken'},{id:5,list:'Bestellen',title:'Filament nachbestellen',note:'Farbe und Material noch auswählen'},{id:6,list:'Gemeinsam',title:'Ideen für die neuen Kinderzimmer sammeln',note:'Gemeinsame Liste',owner:'Sven'},{id:7,list:'Gemeinsam',title:'Besprechen, was wir noch fürs Baby brauchen',note:'Gemeinsame Liste',owner:'Sandra'},{id:8,list:'Haus & Ausbau',title:'Obergeschoss und Dachboden ausmessen',note:'Vorhaben · 3 Schritte'},{id:9,list:'Heute',title:'Gesammelte Ideen gemeinsam durchsehen',note:'Für heute ausgewählt · ohne Fälligkeit'}];function render(){get('n-title').textContent=view;const shared=['Gemeinsam','Haus & Ausbau'].includes(view);get('n-subtitle').textContent=view==='Eingang'?'Erst festhalten. Später einordnen.':shared?'Zusammen planen. Gemeinsam erledigen.':view==='Heute'?'Was du heute angehen möchtest.':'Ideen und Aufgaben an einem Ort.';get('n-sharing').hidden=!shared;get('n-input').placeholder=view==='Eingang'?'Was möchtest du festhalten?':'Aufgabe hinzufügen …';root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));root.querySelector('.n-count').textContent=tasks.filter(t=>t.list==='Eingang'&&!t.done).length;const shown=tasks.filter(t=>t.list===view);get('n-open').textContent=shown.filter(t=>!t.done).length+' offen';get('n-tasks').replaceChildren();shown.forEach(t=>{const row=document.createElement('div');row.className='n-row'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='n-check cursor-interaction';check.checked=!!t.done;check.setAttribute('aria-label',t.title+' erledigen');check.onchange=()=>{t.done=check.checked;render()};const button=document.createElement('button');button.type='button';button.className='n-task cursor-interaction';button.textContent=t.title;const small=document.createElement('small');small.textContent=t.note;button.append(small);button.onclick=()=>{const box=get('n-detail');box.replaceChildren();const title=document.createElement('strong');title.textContent=t.title;const note=document.createElement('p');note.textContent=t.note;const close=document.createElement('button');close.type='button';close.className='cursor-interaction';close.textContent='Schließen';close.onclick=()=>box.hidden=true;box.append(title,note,close);box.hidden=false};row.append(check,button);if(t.owner){const owner=document.createElement('span');owner.className='n-owner';owner.textContent=t.owner;row.append(owner)}get('n-tasks').append(row)})}root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;get('n-detail').hidden=true;render()});get('n-add').onsubmit=e=>{e.preventDefault();const title=get('n-input').value.trim();if(!title)return;tasks.push({id:next++,list:view,title,note:'Ohne Termin'});get('n-input').value='';render()};render()})();
</script>

</body></html>
